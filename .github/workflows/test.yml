name: "Test"

on:
  pull_request:
  push:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: cachix/install-nix-action@v31.11.1
    - uses: cachix/cachix-action@v17
      with:
        name: devenv

    - name: Restore devenv evaluation cache
      id: devenv-cache
      uses: onsails/devenv-cache-action@v3.0.3
      with:
        key-suffix: ${{ github.run_id }}
        cache-nix-eval: true

    - name: Install devenv.sh
      run: nix profile add nixpkgs#devenv

    - name: Build the devenv shell and run tests
      run: devenv test

    - uses: pre-commit/action@v3.0.1
